name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The scratch-waiver test drives gentle-pi's own TypeScript source, which
      # node cannot strip inside node_modules. bun can, so the test runs under
      # bun and skips when it is unavailable.
      - uses: oven-sh/setup-bun@v2

      - run: npm ci
      - run: npm run typecheck

      # The three package suites, then the load contract.
      #
      # The contract has its own step because it is the test that fails when
      # this repository stops being a loadable Pi package: a workspace root
      # with neither a manifest nor an entry point is handed to Pi's module
      # loader, and every agent process dies with "Cannot find module" before
      # the agent starts. That happened once. It must not happen quietly again.
      - run: npm run test:packages
      - run: npm run test:contract
